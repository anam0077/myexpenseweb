<div class="main-content bg">
    <div class="container-fluid center card w-25 color-pattern">
        <h3 class="card-header">Enter the verify code</h3>
        <form [formGroup]="verificationForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="code">Verification Code</label>
                <input type="text" formControlName="code" class="form-control color-pattern"  />
                <div class="invalid-feedback">
                    <div>code is required</div>
                </div>
            </div>
            <div class="form-group" layout="row" layout-align="center center">
            
                    <button [disabled]="loading" class="btn btn-primary">
                        <div class="row">
                            <div class="mt-2 mr-2">
                                Verify
                            </div>
                            <mat-spinner *ngIf="isLoading" [diameter]="30" color="warn"></mat-spinner>
                            <!-- calor accent, warn default blue -->
                        </div>
                    </button>
            </div>
        </form>    
    </div>
</div>
