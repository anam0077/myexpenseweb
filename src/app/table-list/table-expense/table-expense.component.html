<div class="card">
    <div class="card-header" [ngClass]="inputData[0]">
        <h4 class="card-title ">{{inputData[3]}}</h4>
        <p class="card-category"> Total Expense 
            <span *ngIf="!(expenseResponse.body==null)">{{expenseResponse.body.totalAmount}}</span>
        </p>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table">
                <thead class=" text-primary">
                    <th>
                        ID
                    </th>
                    <th>
                        Item
                    </th>
                    <th>
                        Amount
                    </th>
                </thead>
                <tbody *ngIf="!(expenseResponse.body==null)" >
                    <tr *ngFor="let item of expenseResponse.body.itemList; let i = index">
                        <td>
                            {{i+1}}
                        </td>
                        <td>
                            {{item.item}}
                        </td>
                        <td>
                            {{item.amount}}
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
