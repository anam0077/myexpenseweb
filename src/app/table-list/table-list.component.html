<div class="main-content">
  <div class="container-fluid">
      <div class="row">
          <div class="col-md-12">

              <mat-tab-group>
                <mat-tab label="Today"> 
                    <table-expense [inputData]="['card-header-success',today,'0','day']"></table-expense>
                </mat-tab>
                <mat-tab label="Month"> 
                    <table-expense [inputData]="['card-header-warning',thisMonth,'0','month']"></table-expense>
                </mat-tab>
                <mat-tab label="Year"> 
                    <table-expense [inputData]="['card-header-danger',thisYear,'0','year']"></table-expense>
                </mat-tab>
                <mat-tab label="All"> 
                    <table-expense [inputData]="['card-header-primary','','0','all']"></table-expense>
                </mat-tab>
                <mat-tab label="Custom"> 
                    <div class="row">
                         <div class="col-md-2">
                          <button class="mt-3 mb-2" mat-raised-button color="primary" (click)="trigger()">
                            <mat-icon [icIcon]="icSearch"></mat-icon> 
                            Search</button>
                         </div>
                         <div class="col-md-3">
                          <mat-form-field class="mt-2">
                            <mat-label>Enter a date range</mat-label>
                            <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
                              <input matStartDate formControlName="start" placeholder="Start date">
                              <input matEndDate formControlName="end" placeholder="End date">
                            </mat-date-range-input>
                            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-date-range-picker #picker>
                              <mat-date-range-picker-actions>
                                <button mat-button matDateRangePickerCancel>Cancel</button>
                                <button mat-raised-button color="primary" matDateRangePickerApply>Apply</button>
                              </mat-date-range-picker-actions>
                            </mat-date-range-picker>
                            <mat-error *ngIf="range.controls.start.hasError('matStartDateInvalid')">Invalid start date</mat-error>
                            <mat-error *ngIf="range.controls.end.hasError('matEndDateInvalid')">Invalid end date</mat-error>
                          </mat-form-field>
                          
                        </div>
                    </div>
                         
                    <table-expense [inputData]="['card-header-warning',dateRange,'0','custom']"></table-expense>
                </mat-tab> 
              </mat-tab-group>
          </div>
      </div>
  </div>
</div>
