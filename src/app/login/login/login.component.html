<div class="main-content bg">
                <div class="container-fluid center card w-25 color-pattern">
                    <h2 class="card-header">Login</h2>
                    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" formControlName="username" class="form-control color-pattern"  />
                            <div class="invalid-feedback">
                                <div>Username is required</div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" formControlName="password" class="form-control color-pattern"  />
                            <div  class="invalid-feedback">
                                <div >Password is required</div>
                            </div>
                        </div>
                        <div class="form-group">
                        
                                <button [disabled]="loading" class="btn btn-primary">
                                    <div class="row">
                                        <div class="mt-2 mr-2">
                                            Login
                                        </div>
                                        <mat-spinner *ngIf="isLoading" [diameter]="30" color="warn"></mat-spinner>
                                        <!-- calor accent, warn default blue -->
                                    </div>
                                </button>
                                
                            
                            
                            <a [routerLink]="['/register']" class="btn btn-link">Register</a>
                        </div>
                    </form>    
                </div>
</div>
