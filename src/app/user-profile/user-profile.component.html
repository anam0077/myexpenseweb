<div class="main-content">
  <div class="container-fluid">
      <div class="row">
          <div class="col-md-8">
              <div class="card">
                  <div class="card-header card-header-danger">
                      <h4 class="card-title">Usage</h4>
                      <p class="card-category">percentage</p>
                  </div>
                  <div class="card-body">
                      <p>storage size</p>
                      <piechart [usage]="50"></piechart>
                  </div>
              </div>
          </div>
          <div class="col-md-4">
              <div class="card card-profile">
                  <div class="card-avatar">
                      <a href="javascript:void(0)">
                          <img class="img" src="./assets/img/faces/marc.jpg" />
                      </a>
                  </div>
                  <div class="card-body">
                      <h4 class="card-title">{{accountDetail.username}}</h4>
                      <p class="card-description">
                          {{accountDetail.email}}
                      </p>
                  </div>
              </div>
          </div>
      </div>
  </div>
</div>
