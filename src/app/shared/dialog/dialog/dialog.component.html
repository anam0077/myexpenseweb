<div *ngIf="isDeleteAccount">
  <mat-dialog-content>
    <p>Please type username and password to delete the account</p>
    <div layout="column">
      <div flex="">
        <mat-form-field>
          <mat-label>username</mat-label>
          <input matInput [(ngModel)]="username">
        </mat-form-field>
      </div>
      <div flex="">
        <mat-form-field>
          <mat-label>password</mat-label>
          <input matInput [(ngModel)]="password">
        </mat-form-field>
      </div>
    </div>

  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button (click)="onNoClick()">cancel</button>
    <button mat-button [mat-dialog-close]="
    {
      'operation':'confirmation', 
      'payload': {
                  'purpose':'delete', 
                  'data' : {
                            'username':username,
                            'password':password
                           }
                  }
    }" cdkFocusInitial>delete</button>
  </mat-dialog-actions>
</div>

<div *ngIf="isCreateNewExpense">
  <mat-dialog-content>
    <p>Add new expense</p>
    <div layout="column">
      <div flex="">
        <mat-form-field>
          <mat-label>Item</mat-label>
          <input matInput [(ngModel)]="item">
        </mat-form-field>
      </div>
      <div flex="">
        <mat-form-field>
          <mat-label>price</mat-label>
          <input matInput [(ngModel)]="price">
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button (click)="onNoClick()">Cancel</button>
    <button mat-button (click)="createNewExpense()" cdkFocusInitial>Add</button>
  </mat-dialog-actions>
</div>

<div *ngIf="isConfirmation">
  <mat-dialog-content>
    <p>Are you sure to do this action?</p>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button (click)="onNoClick()">cancel</button>
    <button mat-button (click)="confirmationAction(data.payload)" cdkFocusInitial>ok</button>
  </mat-dialog-actions>
</div>

<div *ngIf="isVerboseExpense">
  <mat-dialog-content>
    <p>Expense detail</p>
    <div layout="column"> 

    <div flex="">
      <mat-form-field>
        <mat-label>item</mat-label>
        <input matInput [(ngModel)]="payloadExpense.item">
      </mat-form-field>
    </div>
   
    <div flex="">
    <mat-form-field>
      <mat-label>price</mat-label>
      <input matInput [(ngModel)]="payloadExpense.amount">
    </mat-form-field>
    </div>
    <div flex="">
    <mat-form-field>
      <mat-label>date</mat-label>
      <input matInput [(ngModel)]="payloadExpense.date" (ngModelChange)="onChange($event)" [matDatepicker]="picker">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
    </div>

  </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button (click)="onNoClick()">Cancel</button>
    <button mat-button cdkFocusInitial>Edit</button>
  </mat-dialog-actions>
</div>
